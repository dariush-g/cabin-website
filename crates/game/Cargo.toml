[package]
name = "game"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only the 3D renderer is needed: the overlay UI and wind audio live in the web layer.
bevy = { version = "0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "webgl2",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_anti_alias",
    "bevy_pbr",
    "bevy_light",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    # Look-up tables for the window and ceiling area lights (KTX2, zstd-compressed).
    "area_light_luts",
    "zstd_rust",
] }
console_error_panic_hook = "0.1.7"
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = [
    "CanvasGradient",
    "CanvasRenderingContext2d",
    "Document",
    "HtmlCanvasElement",
    "ImageData",
    "Location",
    "Window",
] }
